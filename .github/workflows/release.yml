name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag matches info.json version
        run: |
          info_version=$(node -p "require('./info.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "$info_version" != "$tag" ]; then
            echo "::error::Tag v$tag does not match info.json version $info_version"
            exit 1
          fi
          echo "version=$info_version" >> "$GITHUB_ENV"

      - name: Resolve release tag
        id: tags
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="v${version}"
            if ! git rev-parse -q --verify "refs/tags/$release_tag" >/dev/null; then
              git tag "$release_tag"
              git push origin "$release_tag"
            fi
          fi
          # A missing previous tag (first release ever) must not fatal the job.
          prev_tag=$(git describe --tags --abbrev=0 "$release_tag^" 2>/dev/null || true)
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$prev_tag" >> "$GITHUB_OUTPUT"

      - name: Package extension zip
        run: |
          zip -r "Vortex_Fallout76-${version}.zip" \
            index.js info.json assets LICENSE README.md

      - name: Build Changelog
        id: build_changelog
        if: steps.tags.outputs.prev_tag != ''
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          mode: "COMMIT"
          fromTag: ${{ steps.tags.outputs.prev_tag }}
          toTag: ${{ steps.tags.outputs.release_tag }}
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}\n\n<details>\n<summary>Full commit range</summary>\n\n#{{UNCATEGORIZED}}\n</details>",
              "pr_template": "",
              "commit_template": "- #{{TITLE}} (#{{HASH}})\n",
              "categories": [
                { "title": "## ✨ Added", "labels": ["feature"] },
                { "title": "## 🐛 Fixed", "labels": ["fix"] },
                { "title": "## 💥 Breaking", "labels": ["breaking"] },
                { "title": "## 📝 Other changes", "labels": ["other"] }
              ],
              "label_extractor": [
                {
                  "pattern": "^(?i:add|feat|implement|introduce|support|allow|strip|keep|ensure)\\b",
                  "on_property": "title",
                  "target": "feature"
                },
                {
                  "pattern": "^(?i:fix|bug|resolve|correct|repair|patch|improve|handle|avoid)\\b",
                  "on_property": "title",
                  "target": "fix"
                },
                {
                  "pattern": "^(?i:break|remove|drop|rename|rework)\\b",
                  "on_property": "title",
                  "target": "breaking"
                },
                {
                  "pattern": ".+",
                  "on_property": "title",
                  "target": "other"
                }
              ],
              "ignorePreReleases": true
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release notes
        env:
          GENERATED: ${{ steps.build_changelog.outputs.changelog }}
        run: |
          if [ -n "$GENERATED" ]; then
            printf '%s\n' "$GENERATED" > release-notes.md
          else
            # First release ever: no previous tag to diff against.
            git log --pretty='- %s' "${{ steps.tags.outputs.release_tag }}" > release-notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tags.outputs.release_tag }}
          name: ${{ steps.tags.outputs.release_tag }}
          body_path: release-notes.md
          files: Vortex_Fallout76-${{ env.version }}.zip
          prerelease: ${{ contains(steps.tags.outputs.release_tag, '-') }}
